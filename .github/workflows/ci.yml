name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0

      - name: Install test dependencies
        run: python3 -m pip install --quiet pytest pyyaml

      - name: Run test suite
        run: python3 -m pytest tests/python -q

      - name: Validate workflow YAML and committed JSON
        run: |
          python3 - <<'EOF'
          import glob, json, yaml
          for f in glob.glob('.github/workflows/*.yml'):
              yaml.safe_load(open(f))
              print('yaml ok:', f)
          # Generated data now lives on the `data` branch; main carries
          # only hand-maintained JSON.
          for f in ['watchlist.json'] + glob.glob('data/*.json'):
              json.load(open(f))
              print('json ok:', f)
          EOF
