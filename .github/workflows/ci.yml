name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install test dependencies
        run: python3 -m pip install --quiet pytest pyyaml

      - name: Run test suite
        run: python3 -m pytest tests/python -q

      - name: Validate workflow YAML and committed JSON
        run: |
          python3 - <<'EOF'
          import glob, json, yaml
          for f in glob.glob('.github/workflows/*.yml'):
              yaml.safe_load(open(f))
              print('yaml ok:', f)
          for f in glob.glob('data/*.json') + ['watchlist.json']:
              json.load(open(f))
              print('json ok:', f)
          EOF
