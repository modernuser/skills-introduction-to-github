name: Daily ops

# 11:17 UTC ≈ 6:17 AM America/Chicago during DST (7:17 winter). GitHub
# Actions cron has no timezone support — UTC only — so the local time
# drifts an hour across DST changes; acceptable for a daily report.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write
  issues: write

concurrency: daily-ops

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: python3 -m pip install --quiet pytest pyyaml

      - name: Hydrate data and reports from data branch
        run: python3 scripts/data_branch.py hydrate

      - name: Gather recent workflow conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --limit 30 \
            --json conclusion > runs.json || echo "[]" > runs.json

      - name: Run daily health checks and reports
        id: ops
        run: python3 scripts/daily_ops.py runs.json

      - name: Publish reports to data branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/data_branch.py publish "Daily ops report"

      - name: Alert on findings
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"Daily ops findings" in:title' \
            --json number --jq '.[0].number')
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            # A recurring failure must keep announcing itself. Staying
            # silent because an issue already existed hid a six-day
            # outage in July 2026. Comment (which emails) at most every
            # 12h so the thread shows the streak without spamming.
            last=$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" \
              --json comments --jq '[.comments[].createdAt] | last // empty')
            cutoff=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            if [ -z "$last" ] || [ "$last" \< "$cutoff" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
                --body "Still failing as of $(date -u +%Y-%m-%dT%H:%MZ). Run: $RUN_URL" \
                || echo "comment failed; see run log"
            else
              echo "issue #$existing commented within 12h; not repeating"
            fi
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Daily ops findings ($(date -u +%Y-%m-%d))" \
            --body "The deterministic daily health check found actionable issues. See reports/daily/ and the run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            || echo "issue creation failed; see run log"
          FAILURE_CONTEXT="Daily ops found actionable issues: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
            python3 scripts/notify_slack.py failure
