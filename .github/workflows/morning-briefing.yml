name: Morning briefing

on:
  schedule:
    # Weekdays 11:47 UTC — before the 9:30am ET market open year-round.
    - cron: "47 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency: morning-briefing

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build briefing
        run: python3 scripts/morning_briefing.py briefing.md

      # One open briefing at a time: close yesterday's, open today's.
      # The issue-create is what emails the repo owner.
      - name: Notify via issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                       --search "Pre-market briefing in:title" \
                       --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "Superseded by today's briefing."
          done
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Pre-market briefing $(date -u +%Y-%m-%d)" \
            --body-file briefing.md

      # Slack mirror (inert until the SLACK_WEBHOOK_URL secret exists).
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/notify_slack.py briefing briefing.md

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"Morning briefing failed" in:title' \
            --json number --jq '.[0].number')
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            # A recurring failure must keep announcing itself. Staying
            # silent because an issue already existed hid a six-day
            # outage in July 2026. Comment (which emails) at most every
            # 12h so the thread shows the streak without spamming.
            last=$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" \
              --json comments --jq '[.comments[].createdAt] | last // empty')
            cutoff=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            if [ -z "$last" ] || [ "$last" \< "$cutoff" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
                --body "Still failing as of $(date -u +%Y-%m-%dT%H:%MZ). Run: $RUN_URL" \
                || echo "comment failed; see run log"
            else
              echo "issue #$existing commented within 12h; not repeating"
            fi
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Morning briefing failed ($(date -u +%Y-%m-%d))" \
            --body "Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            || echo "issue creation failed; see run log"
