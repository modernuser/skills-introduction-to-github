name: Sector depth

# Once daily after the US close (22:17 UTC is 18:17 ET in DST, 17:17 ET in
# winter — after the bell either way). Volatility rankings move slowly;
# intraday price movement comes free from data/sp500_closes.json, which
# the all-session quotes pipeline already refreshes.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * 1-5"

permissions:
  contents: write
  issues: write

concurrency: sector-depth

jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Hydrate data from data branch
        run: python3 scripts/data_branch.py hydrate

      - name: Rank sectors by realized volatility
        run: python3 scripts/sector_depth.py

      # Feature predictability diagnostic. Best-effort: it is a report
      # about the data, and a failed report must never cost the rankings.
      - name: Measure feature predictability
        run: python3 scripts/factor_lab.py || echo "factor lab failed; rankings continue"

      - name: Validate data
        run: python3 scripts/validate_data.py

      - name: Publish data to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/data_branch.py publish "Update sector depth"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"Sector depth failed" in:title' \
            --json number --jq '.[0].number')
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            # A recurring failure must keep announcing itself. Staying
            # silent because an issue already existed hid a six-day
            # outage in July 2026. Comment (which emails) at most every
            # 12h so the thread shows the streak without spamming.
            last=$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" \
              --json comments --jq '[.comments[].createdAt] | last // empty')
            cutoff=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            if [ -z "$last" ] || [ "$last" \< "$cutoff" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
                --body "Still failing as of $(date -u +%Y-%m-%dT%H:%MZ). Run: $RUN_URL" \
                || echo "comment failed; see run log"
            else
              echo "issue #$existing commented within 12h; not repeating"
            fi
            exit 0
          fi
          FAILURE_CONTEXT="Sector depth ranking failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
            python3 scripts/notify_slack.py failure || true
