name: Update market quotes

# Refresh market data during US market hours (13:00-21:00 UTC covers
# 9am-5pm ET), weekdays only, plus manual runs. Off-peak minutes because
# GitHub throttles congested cron slots — measured reality is a handful
# of runs/day regardless of how often the spec asks.
on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 13-21 * * 1-5"

permissions:
  contents: write
  issues: write

concurrency:
  group: quotes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest quotes
        run: python3 scripts/update_quotes.py

      # News is best-effort: a failed headline fetch must not block quotes.
      - name: Fetch latest headlines
        run: python3 scripts/update_news.py || echo "news fetch failed; quotes continue"

      # Rolling S&P 500 movers: also best-effort.
      - name: Update S&P 500 movers
        run: python3 scripts/update_movers.py || echo "movers update failed; quotes continue"

      # In-repo verification: never commit malformed or stale data. A
      # validation failure fails the job, which opens the alert issue.
      - name: Validate data
        run: python3 scripts/validate_data.py

      # Roadmap item 1: each ticker's ±3% day gets one email, via issue.
      # State updates locally here; it only persists via the commit step,
      # so a failed notification means a clean retry next run.
      - name: Significant-move notifications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_moves.py moves_body.md moves_title.txt
          if [ -f moves_body.md ]; then
            title=$(cat moves_title.txt)
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "\"$title\" in:title" --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file moves_body.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "⚠ $title" --body-file moves_body.md
            fi
          fi

      - name: Commit if changed
        run: |
          git add data/quotes.json
          for f in data/news.json data/movers.json data/sp500_closes.json data/notified_moves.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update market quotes [skip ci]"
          git push

      # M1 corrective action: a silent pipeline is the worst failure mode.
      # On any failed run, open an issue so the repo owner gets an email.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"Quotes pipeline failed" in:title' \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "open failure issue #$existing exists; not creating another"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Quotes pipeline failed ($(date -u +%Y-%m-%d))" \
            --body "A scheduled market-data update failed. Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            || echo "issue creation failed; see run log"
