name: Update market quotes

# Market data refresh across ALL sessions, not just regular hours.
# Times are UTC (Actions cron is UTC-only); ET is UTC-4 in DST, UTC-5 in
# winter, so the windows are widened to cover both — market_session.py
# labels each run correctly regardless. Off-peak minutes because GitHub
# throttles congested cron slots; no-op suppression prevents churn.
on:
  workflow_dispatch:
  schedule:
    # Pre-market (04:00-09:30 ET)
    - cron: "13,43 8-13 * * 1-5"
    # Regular session (09:30-16:00 ET)
    - cron: "7,27,47 14-20 * * 1-5"
    # After hours (16:00-20:00 ET) incl. the wrap past midnight UTC
    - cron: "17,47 21-23 * * 1-5"
    - cron: "17 0,1 * * 2-6"
    # Weekend: headlines keep moving even when prices do not
    - cron: "23 14,22 * * 6,0"

permissions:
  contents: write   # writes to the `data` branch only, never to main
  issues: write

concurrency:
  group: quotes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3  # v6.0.0

      # Generated data lives on the `data` branch so `main` stays code-only
      # and can be fully protected. Restore persisted state first.
      - name: Hydrate data from data branch
        run: python3 scripts/data_branch.py hydrate

      - name: Fetch latest quotes
        run: python3 scripts/update_quotes.py

      # News is best-effort: a failed headline fetch must not block quotes.
      - name: Fetch latest headlines
        run: python3 scripts/update_news.py || echo "news fetch failed; quotes continue"

      # Pre/after-hours prices (no-op during regular hours and closures).
      - name: Fetch extended-hours prices
        run: python3 scripts/update_extended.py || echo "extended fetch failed; continuing"

      # Rolling S&P 500 movers: also best-effort.
      - name: Update S&P 500 movers
        run: python3 scripts/update_movers.py || echo "movers update failed; quotes continue"

      # Dartboard experiment: revalues the three paper portfolios from
      # data the steps above already fetched. Best-effort.
      - name: Update paper portfolios
        run: python3 scripts/update_portfolios.py || echo "portfolios update failed; quotes continue"

      # In-repo verification: never commit malformed or stale data. A
      # validation failure fails the job, which opens the alert issue.
      - name: Validate data
        run: python3 scripts/validate_data.py

      # Roadmap item 1: each ticker's ±3% day gets one email, via issue.
      # State updates locally here; it only persists via the commit step,
      # so a failed notification means a clean retry next run.
      - name: Significant-move notifications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_moves.py moves_body.md moves_title.txt
          if [ -f moves_body.md ]; then
            title=$(cat moves_title.txt)
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "\"$title\" in:title" --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file moves_body.md
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "⚠ $title" --body-file moves_body.md
            fi
            SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
              python3 scripts/notify_slack.py moves moves_body.md
          fi

      - name: Publish data to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/data_branch.py publish "Update market data"

      # M1 corrective action: a silent pipeline is the worst failure mode.
      # On any failed run, open an issue so the repo owner gets an email.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"Quotes pipeline failed" in:title' \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "open failure issue #$existing exists; not creating another"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Quotes pipeline failed ($(date -u +%Y-%m-%d))" \
            --body "A scheduled market-data update failed. Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            || echo "issue creation failed; see run log"
          FAILURE_CONTEXT="Market-data update failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
            python3 scripts/notify_slack.py failure
